<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=390,user-scalable=no"><title>v2-A 墨卷长轴</title>
<style>
@font-face{font-family:Brush;src:url(fonts/brush.woff) format('woff')}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
html,body{width:390px;height:844px;overflow:hidden;background:#111}
body{font-family:"Noto Serif CJK SC",serif;color:#1a1a1a}
.app{position:relative;width:390px;height:844px;overflow:hidden;background:#efe5cf}
.bg{position:absolute;inset:0}
svg{width:100%;height:100%}
.num{font-family:Georgia,"Times New Roman",serif;font-weight:700}
.brush{font-family:Brush,serif}
/* top */
.top{position:absolute;top:10px;left:12px;right:12px;height:34px;display:flex;align-items:center;gap:10px;z-index:3}
.seal{width:30px;height:30px;background:url(#) ;background:radial-gradient(circle at 35% 30%,#c4513e,#8a2a1d);color:#f6ead2;display:grid;place-items:center;font-family:Brush;font-size:20px;border-radius:3px;box-shadow:0 2px 4px rgba(0,0,0,.35),inset 0 0 0 2px rgba(246,234,210,.5);transform:rotate(-4deg)}
.turn{font-size:13px;color:#5a4a33;letter-spacing:1px}.turn b{font-size:18px;color:#1a1a1a}
.sp{flex:1}.res{display:flex;align-items:center;gap:4px;font-size:15px;color:#2a2116}.res svg{width:18px;height:18px;fill:#b98a3c}
.gear{width:22px;height:22px;fill:#3b3226;opacity:.8}
/* enemies */
.row{position:absolute;left:0;right:0;display:flex;justify-content:center}
.row.back{top:62px;gap:96px;filter:saturate(.6);opacity:.78}.row.front{top:178px;gap:4px}
.en{position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .2s,filter .2s}
.en .fig{width:84px;height:140px;fill:url(#inkfade);filter:url(#brush);transform:scaleX(-1)}
.back .en .fig{width:62px;height:104px;fill:url(#inkfade2)}
.en.boss .fig{width:128px;height:172px}
.en .shadow{position:absolute;bottom:22px;width:80%;height:12px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.35),transparent 70%)}
.intent{position:absolute;top:-20px;display:flex;align-items:center;gap:2px;padding:3px 8px 3px 5px;border-radius:16px;background:radial-gradient(circle at 30% 30%,#3a3a3a,#111);color:#f6ead2;box-shadow:0 3px 6px rgba(0,0,0,.4),inset 0 0 0 1.5px rgba(246,234,210,.25);z-index:2}
.intent svg{width:18px;height:18px;fill:#f6ead2}.intent .num{font-size:18px;line-height:1}
.intent.atk svg{fill:#ff8a73}.intent.def svg{fill:#9cc3d1}.intent.buff svg{fill:#e9c877}
.intent.lethal{background:radial-gradient(circle at 30% 30%,#d4604c,#7d2418);padding:4px 11px 4px 7px;box-shadow:0 0 0 2px #f6ead2,0 0 18px 4px rgba(200,60,40,.7);animation:pulse 1.2s infinite}
.intent.lethal svg{width:22px;height:22px;fill:#fff}.intent.lethal .num{font-size:23px}
@keyframes pulse{50%{box-shadow:0 0 0 2px #f6ead2,0 0 28px 8px rgba(200,60,40,.9)}}
.back .intent{transform:scale(.85);top:-18px}
.hp{position:relative;width:64px;height:11px;margin-top:-18px;border-radius:6px;background:#3a2f26;box-shadow:inset 0 1px 2px #000,0 1px 0 rgba(255,255,255,.4);overflow:hidden}
.boss .hp{width:100px;height:13px}
.hp i{position:absolute;inset:0;background:linear-gradient(#d4604c,#8a2a1d)}
.hp span{position:absolute;inset:0;text-align:center;font-size:9.5px;line-height:11px;color:#fff;text-shadow:0 0 2px #000}
.boss .hp span{font-size:11px;line-height:13px}
.shd{position:absolute;left:-16px;top:124px;width:22px;height:22px}.shd svg{fill:#5b7c8a;filter:drop-shadow(0 1px 1px #000)}.shd b{position:absolute;inset:0;text-align:center;line-height:22px;font-size:11px;color:#fff}
body.targeting .front .en .fig{filter:url(#brush) drop-shadow(0 0 6px #c4513e)}
body.targeting .back .en{opacity:.35}
/* judge */
.judge{position:absolute;left:318px;top:392px;width:46px;height:64px;border-radius:5px;background:linear-gradient(160deg,#fbf6ea,#e6dbc2);box-shadow:0 4px 10px rgba(0,0,0,.35),inset 0 0 0 2px #1a1a1a,inset 0 0 0 4px #e9c877;transform:rotate(-8deg);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:flip 1.1s ease-out}
.judge .s{font-size:22px;color:#a63d2f;line-height:1}.judge .num{font-size:16px;color:#a63d2f}
.judge .tag{position:absolute;right:-12px;top:-10px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a3a3a,#111);display:grid;place-items:center}.judge .tag svg{width:14px;height:14px;fill:#e9c877}
@keyframes flip{from{transform:rotate(-8deg) rotateY(180deg)}}
/* hero */
.hero{position:absolute;left:-26px;top:404px;width:250px;height:270px;fill:url(#inkfade);filter:url(#brush)}
.herolight{position:absolute;left:0;top:430px;width:220px;height:220px;background:radial-gradient(circle,rgba(255,250,235,.85),transparent 65%)}
.stat{position:absolute;left:150px;top:536px;display:flex;align-items:center;gap:6px}
.hearts{display:flex;gap:2px}.hearts svg{width:24px;height:24px;fill:url(#cinn);filter:drop-shadow(0 2px 1px rgba(0,0,0,.35))}.hearts svg.e{fill:#c9bda4;opacity:.7}
.armor{position:relative;width:32px;height:34px}.armor svg{fill:#4a6a78;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}.armor b{position:absolute;inset:0;text-align:center;line-height:32px;color:#fff;font-size:16px}
.vice{position:absolute;left:300px;top:486px;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle,#fbf6ea 30%,#d9ccad);box-shadow:0 0 0 2px #1a1a1a,0 0 0 4px #e9c877,0 4px 10px rgba(0,0,0,.4);overflow:hidden}
.vice svg{fill:#1a1a1a;filter:url(#brush);margin-top:6px}
.vice::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 12px 3px rgba(233,200,119,.9);animation:ready 1.6s infinite}
@keyframes ready{50%{opacity:.3}}
.vchip{position:absolute;left:342px;top:536px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d4604c,#7d2418);color:#fff;font-size:12px;text-align:center;line-height:22px;box-shadow:0 0 0 1.5px #f6ead2}
.name{position:absolute;left:152px;top:470px;writing-mode:vertical-rl;font-family:Brush;font-size:30px;color:#1a1a1a;letter-spacing:2px}
.name small{display:block;width:20px;height:20px;margin-top:6px;background:#a63d2f;color:#f6ead2;font-size:13px;text-align:center;line-height:20px;border-radius:2px}
/* bottom bar */
.tray{position:absolute;left:0;right:0;bottom:0;height:196px;background:linear-gradient(transparent,rgba(26,22,16,.55) 40%,rgba(20,17,12,.9));}
.energy{position:absolute;left:12px;bottom:150px;width:66px;height:66px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#4a4a4a,#0d0d0d 70%);box-shadow:0 0 0 3px #b98a3c,0 0 0 5px #1a1a1a,0 0 20px 4px rgba(233,200,119,.55),inset 0 -6px 12px rgba(255,255,255,.12);display:grid;place-items:center;color:#f6ead2;z-index:4}
.energy .num{font-size:30px;line-height:1;position:relative;top:-3px}.energy small{position:absolute;bottom:8px;font-size:11px;opacity:.75}
.energy::before{content:"";position:absolute;inset:8px;border-radius:50%;background:radial-gradient(circle at 50% 70%,rgba(91,124,138,.5),transparent 60%);animation:swirl 4s linear infinite}
@keyframes swirl{to{transform:rotate(360deg)}}
.hand{position:absolute;left:0;right:0;bottom:16px;height:140px;z-index:5}
.card{position:absolute;bottom:0;left:50%;width:74px;height:108px;margin-left:-37px;border-radius:7px;transform-origin:50% 100%;transition:transform .18s,filter .18s;cursor:pointer;
 background:linear-gradient(160deg,#2d2a26,#0f0e0d);box-shadow:0 6px 12px rgba(0,0,0,.55);padding:3px}
.card .in{position:relative;width:100%;height:100%;border-radius:5px;background:linear-gradient(#f8f1e0,#e2d5b8);box-shadow:inset 0 0 0 1px #b98a3c;overflow:hidden}
.card .art{position:absolute;left:5px;right:5px;top:5px;height:62px;border-radius:3px;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),inset 0 0 14px rgba(0,0,0,.45)}
.card.atk .art{background:radial-gradient(circle at 50% 40%,#c4513e,#5a1b12)}.card.def .art{background:radial-gradient(circle at 50% 40%,#7ea3b1,#24414c)}.card.heal .art{background:radial-gradient(circle at 50% 40%,#7dbb9c,#1d4a3a)}.card.skill .art{background:radial-gradient(circle at 50% 40%,#8a7a5c,#2e261a)}
.card .art svg{width:46px;height:46px;fill:#f6ead2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.card .art::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.25) 45%,transparent 55%)}
.card .nm{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-family:Brush;font-size:22px;line-height:1}
.card .c{position:absolute;left:-4px;top:-4px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a4a4a,#0d0d0d);color:#f6ead2;font-size:15px;text-align:center;line-height:26px;box-shadow:0 0 0 1.5px #e9c877,0 2px 3px rgba(0,0,0,.5);z-index:2}
.card .su{position:absolute;right:2px;top:2px;width:22px;height:24px;border-radius:2px;background:#f8f1e0;font-size:11px;line-height:11px;text-align:center;padding-top:1px;box-shadow:0 0 0 1px #1a1a1a;z-index:2}
.card .su.r{color:#a63d2f}
.card .mo{position:absolute;right:-6px;bottom:-6px;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#333,#000);color:#e9c877;font-family:Brush;font-size:17px;text-align:center;line-height:28px;z-index:3;box-shadow:0 0 10px 3px rgba(233,200,119,.75)}
.card.moc{box-shadow:0 0 0 1px #e9c877,0 0 14px 2px rgba(233,200,119,.55),0 6px 12px rgba(0,0,0,.55)}
.card.sel,.card.lift{z-index:9}
body.targeting .card.sel{filter:drop-shadow(0 0 10px #ffcf7a)}
.pile{position:absolute;bottom:156px;display:flex;align-items:center;gap:3px;color:#f6ead2;font-size:13px;z-index:4}.pile svg{width:22px;height:22px;fill:#d9ccad}
.end{position:absolute;right:12px;bottom:146px;width:72px;height:40px;border-radius:20px;background:radial-gradient(circle at 40% 30%,#d4604c,#7d2418);color:#f6ead2;font-family:Brush;font-size:21px;text-align:center;line-height:40px;box-shadow:0 0 0 2px #f6ead2,0 0 0 3.5px #7d2418,0 4px 10px rgba(0,0,0,.5);z-index:4}
.pot{position:absolute;left:88px;bottom:156px;display:flex;gap:6px;z-index:4}.pot span{width:28px;height:28px;border-radius:50%;background:rgba(246,234,210,.15);box-shadow:inset 0 0 0 1px rgba(246,234,210,.4);display:grid;place-items:center}.pot svg{width:18px;height:18px;fill:#7dbb9c}
/* response */
.mask{position:absolute;inset:0;z-index:6;background:radial-gradient(ellipse at 50% 45%,rgba(10,8,6,.45),rgba(10,8,6,.88));opacity:0;pointer-events:none;transition:.25s}
body.resp .mask{opacity:1;pointer-events:auto}
body.resp .en.boss{z-index:7}body.resp .row.front{z-index:7}body.resp .row.front .en:not(.boss){opacity:.15}
body.resp .hero,body.resp .stat{z-index:7}
body.resp .hand{z-index:8}
body.resp .card{filter:brightness(.35) saturate(.3)}
body.resp .card.legal{filter:none;box-shadow:0 0 0 2px #ffe2a0,0 0 22px 6px rgba(255,200,110,.8)}
.slash{position:absolute;left:100px;top:300px;width:200px;height:220px;z-index:7;opacity:0;pointer-events:none}
body.resp .slash{opacity:1}
.ring{position:absolute;left:225px;top:575px;width:150px;height:96px;z-index:8;opacity:0;pointer-events:none;display:flex;flex-direction:column;align-items:center}
body.resp .ring{opacity:1;pointer-events:auto}
.ring .q{position:relative;width:74px;height:74px}
.ring .q svg.r{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .q .ic{position:absolute;inset:14px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#7ea3b1,#1d3a45);display:grid;place-items:center;box-shadow:0 0 18px rgba(126,163,177,.8)}
.ring .q .ic svg{width:30px;height:30px;fill:#f6ead2}
.ring .t{position:absolute;right:-6px;top:-4px;color:#f6ead2;font-size:16px}
.take{margin-top:6px;display:flex;align-items:center;gap:3px;padding:4px 12px;border-radius:14px;background:rgba(0,0,0,.55);box-shadow:inset 0 0 0 1px rgba(246,234,210,.4);color:#f6ead2;font-size:14px}.take svg{width:16px;height:16px;fill:url(#cinn)}
.dmg{position:absolute;left:70px;top:470px;z-index:8;opacity:0;color:#ff8a73;font-size:34px;text-shadow:0 0 6px #000,0 2px 0 #000;display:flex;align-items:center;gap:2px}
body.resp .dmg{opacity:1}.dmg svg{width:26px;height:26px;fill:#ff8a73}
#tip{position:absolute;z-index:20;width:180px;padding:12px;border-radius:8px;background:linear-gradient(#fbf6ea,#eadfc6);box-shadow:0 0 0 1px #1a1a1a,0 0 0 3px #e9c877,0 10px 24px rgba(0,0,0,.6);font-size:13px;line-height:1.5;display:none}
#tip.on{display:block}#tip b{font-family:Brush;font-size:24px;font-weight:normal}#tip .tc{margin-left:8px;display:inline-block;width:22px;height:22px;border-radius:50%;background:#111;color:#f6ead2;text-align:center;line-height:22px}#tip .ts{float:right;margin-top:6px}#tip .r{color:#a63d2f}#tip .tm{color:#8a6a2a;font-size:12px}

<script>const HAND=[
 {n:'杀',c:1,s:'♠',r:'A',k:'atk',i:'i-sword',d:'对前排一名敌人造成 2 点伤害'},
 {n:'闪',c:1,s:'♥',r:'K',k:'def',i:'i-dodge',d:'响应：抵消一次【杀】',mo:1},
 {n:'龙胆',c:2,s:'♣',r:'9',k:'atk',i:'i-spear',d:'杀/闪互转；当杀时伤害 +1',mo:1},
 {n:'桃',c:0,s:'♦',r:'3',k:'heal',i:'i-peach',d:'回复 1 点体力'},
 {n:'无懈',c:1,s:'♠',r:'Q',k:'skill',i:'i-scroll',d:'响应：抵消一张锦囊'},
 {n:'藤甲',c:2,s:'♥',r:'5',k:'def',i:'i-armor',d:'获得 3 护甲'}];
const ENEMY={back:[{n:'弓手',f:'archer',hp:3,mx:4,it:'i-arrow',v:'1×2',t:'atk'},{n:'鼓手',f:'archer',hp:4,mx:4,it:'i-drum',v:'+1',t:'buff'}],
 front:[{n:'青州兵',f:'soldier',hp:4,mx:6,sh:2,it:'i-sword',v:'2',t:'atk'},{n:'张郃',f:'boss',hp:18,mx:20,it:'i-swords',v:'6',t:'lethal',boss:1},{n:'青州兵',f:'soldier',hp:2,mx:6,it:'i-shield',v:'3',t:'def'}]};
const red=s=>s=='♥'||s=='♦';
const use=(id,cls='')=>`<svg class="${cls}"><use href="#${id}"/></svg>`;
function longpress(el,fn){let t;el.addEventListener('pointerdown',e=>{t=setTimeout(()=>{fn(e);el.dataset.lp=1},420)});['pointerup','pointerleave'].forEach(v=>el.addEventListener(v,()=>clearTimeout(t)));}
function tipShow(html,x,y){const t=document.getElementById('tip');t.innerHTML=html;t.style.left=Math.min(Math.max(x-90,8),202)+'px';t.style.top=Math.max(y-150,60)+'px';t.classList.add('on');}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#tip'))document.getElementById('tip')?.classList.remove('on')},true);
function setState(){const h=location.hash;document.body.classList.toggle('resp',h=='#resp');if(h=='#detail'){const c=document.querySelectorAll('.card')[2];const r=c.getBoundingClientRect();c.classList.add('lift');showCard(2,r.left+r.width/2,r.top);}if(h=='#target'){document.querySelectorAll('.card')[0].classList.add('sel');document.body.classList.add('targeting');}}
function showCard(i,x,y){const c=HAND[i];tipShow(`<b>${c.n}</b><span class="tc">${c.c}</span><span class="ts ${red(c.s)?'r':''}">${c.s}${c.r}</span><p>${c.d}</p>${c.mo?'<p class="tm">墨 · 灵光一闪可强化</p>':''}`,x,y);}

const mk=(e)=>`<div class="en ${e.boss?'boss':''}"><div class="intent ${e.t}">${use(e.it)}<span class="num">${e.v}</span></div><span class="shadow"></span><svg class="fig"><use href="#${e.f}"/></svg><div class="hp"><i style="right:${100-e.hp/e.mx*100}%"></i><span class="num">${e.hp}/${e.mx}</span></div>${e.sh?`<div class="shd">${use('i-shield')}<b class="num">${e.sh}</b></div>`:''}</div>`;
back.innerHTML=ENEMY.back.map(mk).join('');front.innerHTML=ENEMY.front.map(mk).join('');
hearts.innerHTML=[1,1,1,1,0].map(f=>`<svg class="${f?'':'e'}"><use href="#i-heart"/></svg>`).join('');
const N=HAND.length;hand.innerHTML=HAND.map((c,i)=>{const a=(i-(N-1)/2)*4.5,x=(i-(N-1)/2)*54,y=Math.abs(i-(N-1)/2)**2*3;return `<div class="card ${c.k} ${c.mo?'moc':''} ${i==1||i==2?'legal':''}" data-i="${i}" style="--t:translateX(${x}px) translateY(${y}px) rotate(${a}deg);transform:var(--t)"><div class="in"><div class="art">${use(c.i)}</div><div class="nm">${c.n}</div></div><span class="c num">${c.c}</span><span class="su ${red(c.s)?'r':''}">${c.s}<br><span class="num">${c.r}</span></span>${c.mo?'<span class="mo">墨</span>':''}</div>`}).join('');
document.querySelectorAll('.card').forEach(c=>{const t=c.style.getPropertyValue('--t');
 const up=()=>c.style.transform=t+' translateY(-26px) scale(1.12)';
 new MutationObserver(()=>{if(c.classList.contains('sel')||c.classList.contains('lift'))up();else c.style.transform=t;}).observe(c,{attributes:true,attributeFilter:['class']});
 longpress(c,()=>{const r=c.getBoundingClientRect();c.classList.add('lift');showCard(+c.dataset.i,r.left+r.width/2,r.top)});
 c.addEventListener('click',e=>{if(c.dataset.lp){delete c.dataset.lp;c.classList.remove('lift');return}const on=!c.classList.contains('sel');document.querySelectorAll('.card').forEach(x=>x.classList.remove('sel'));c.classList.toggle('sel',on);document.body.classList.toggle('targeting',on)})});
document.querySelectorAll('.en').forEach(e=>e.addEventListener('click',()=>{if(!document.body.classList.contains('targeting')||e.closest('.back'))return;e.animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(6px)'},{transform:'none'}],300);document.querySelectorAll('.card').forEach(x=>x.classList.remove('sel'));document.body.classList.remove('targeting')}));
document.querySelector('.end').onclick=()=>location.hash='resp';
onhashchange=()=>{document.body.classList.remove('targeting');document.querySelectorAll('.card').forEach(x=>x.classList.remove('sel','lift'));tip.classList.remove('on');setState()};setState();
</script></body></html>
