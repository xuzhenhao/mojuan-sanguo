.stall{position:absolute;top:48px;left:0;right:0;height:200px}
.awn{position:absolute;top:0;left:14px;right:14px;height:34px;background:repeating-linear-gradient(90deg,#7d2418 0 30px,#a63d2f 30px 60px);clip-path:polygon(0 0,100% 0,100% 70%,96% 100%,92% 70%,88% 100%,84% 70%,80% 100%,76% 70%,72% 100%,68% 70%,64% 100%,60% 70%,56% 100%,52% 70%,48% 100%,44% 70%,40% 100%,36% 70%,32% 100%,28% 70%,24% 100%,20% 70%,16% 100%,12% 70%,8% 100%,4% 70%,0 100%);box-shadow:0 4px 0 var(--gold-lo)}
.merchant{position:absolute;left:24px;top:40px;width:130px;height:150px;fill:url(#inkfade);filter:url(#brush) drop-shadow(0 0 20px rgba(233,200,119,.25))}
.say{position:absolute;left:150px;top:70px;padding:10px 14px;font-family:Brush;font-size:22px;color:var(--gold)}
.say::before{content:"";position:absolute;left:-8px;top:18px;border:8px solid transparent;border-right-color:var(--gold-lo);border-left:0}
.coins{position:absolute;right:20px;top:150px;display:flex;align-items:center;gap:6px;font-size:22px}.coins svg{width:24px;height:24px;fill:var(--gold)}
.zone{position:absolute;left:10px;right:10px}
.cards{top:236px;display:flex;justify-content:space-between;align-items:flex-end;gap:4px}
.it{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:0}
.it.sold{opacity:.35;filter:grayscale(1)}
/* 5 卡用中号牌（72→略压），大牌装不下；奖励页仍用 .big */
.card.shop{width:66px;height:96px;padding:2px}
.card.shop .art{inset:3px 3px 22px}
.card.shop .cn{font-size:16px;bottom:2px}
.card.shop .c{width:18px;height:18px;line-height:18px;font-size:11px}
.card.shop .su{top:22px;font-size:10px;line-height:10px}
.card.shop .rar{width:8px;height:8px;right:2px;top:2px}
.slot{font-family:Brush;font-size:12px;color:var(--gold-lo);letter-spacing:.5px;line-height:1}
.slot.faction{color:#c9a55a}
.slot.exclusive{color:#9ad4b8}
.shelf{position:absolute;left:10px;right:10px;height:10px;background:linear-gradient(#6e4a18,#e9c877 40%,#6e4a18);border-radius:2px;box-shadow:0 4px 8px #000}
/* 1 宝物 + 2 丹药等距；删牌改为服务按钮，不再占「4 物」槽 */
.row2{top:456px;display:flex;justify-content:space-around;align-items:flex-end;padding:0 24px}
.orb{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#4a4a4a,#0a0a0a);box-shadow:0 0 0 2px var(--gold),0 0 0 5px var(--lac-3),0 0 18px rgba(233,200,119,.4)}
.orb svg{width:34px;height:34px;fill:var(--gold)}.orb.p svg{fill:#9ad4b8}.orb.w svg{fill:#ff9a85}.orb.x{background:radial-gradient(circle at 35% 30%,#5a2a20,#1a0806)}.orb.x svg{fill:var(--paper)}
.orb{position:relative}.gem{position:absolute;right:2px;top:2px;width:12px;height:12px;transform:rotate(45deg);background:var(--gold);box-shadow:0 0 0 1px #000}
.sale{position:absolute;margin:-120px 0 0 60px;width:34px;height:34px;line-height:34px;font-size:15px;border-radius:50%;transform:rotate(12deg)}
.refresh{top:620px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.bar .btn{margin-left:auto}
