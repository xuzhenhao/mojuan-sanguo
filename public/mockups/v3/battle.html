<script>
// ---- 体力显示规则（#129 / render-spec §8.8.2）----
const BEAD_MAIN=17, GAP_MIN=2, GAP_MAX=4, DOTS_MAX=6;
function heroHp(hp,max,innerW){
  // innerW = 卡内窗宽 - 左右各 6 内边距
  if(max<=DOTS_MAX){
    const gap=Math.max(GAP_MIN,Math.min(GAP_MAX,(innerW-max*BEAD_MAIN)/(max-1||1)));
    const tot=max*BEAD_MAIN+(max-1)*gap, x0=(innerW+12-tot)/2-5;
    return '<div class="beads">'+Array.from({length:max},(_,k)=>`<i class="bead ${k<hp?'':'e'}" style="left:${x0+k*(BEAD_MAIN+gap)}px"></i>`).join('')+'</div>';
  }
  // >6：紧凑式 —— 1 颗勾玉 + 数字；满血写「×N」，掉血写「cur/max」
  return `<div class="hpc"><i class="bead ${hp?'':'e'}"></i>`+(hp===max?`<span class="num">×${max}</span>`:`<span class="num">${hp}</span><small class="num">/${max}</small>`)+'</div>';
}
// 敌人一律数字；Boss / 体力>10 用血条＋居中数字
const enemyHp=e=> (e.boss||e.mx>10)?`<div class="hpbar"><i style="right:${100-e.hp/e.mx*100}%"></i><span class="num">${e.hp}/${e.mx}</span></div>`:`<div class="hpn"><i></i><span class="num">${e.hp}/${e.mx}</span></div>`;
// 牌名自适应：20px 起每次 -1，最小 11px，仍放不下则省略号（长按看全名）
function fitName(el){let s=20;el.style.fontSize=s+'px';while(el.scrollWidth>el.clientWidth&&s>11){s--;el.style.fontSize=s+'px'}el.dataset.fs=s;el.title=el.textContent;}

const ENEMIES={
 E101:{n:'黄巾步卒',g:'卒',hp:3,mx:3,it:'i-sword',v:'1×2',t:'atk'},
 E102:{n:'黄巾弓手',g:'弓',hp:3,mx:3,it:'i-arrow',v:'1',t:'atk'},
 B1:{n:'张角·墨魇',g:'角',hp:18,mx:18,it:'i-swords',v:'1×2',t:'atk',boss:1}};
let HAND=[
 {n:'杀',c:1,s:'♠',r:'7',k:'atk',i:'i-sword'},{n:'闪',c:1,s:'♥',r:'2',k:'def',i:'i-dodge'},
 {n:'方天戟',c:2,s:'♦',r:'Q',k:'atk',i:'i-spear',mo:1},{n:'桃',c:0,s:'♥',r:'3',k:'heal',i:'i-peach'},
 {n:'无懈可击',c:1,s:'♠',r:'J',k:'skill',i:'i-scroll'},{n:'藤甲',c:2,s:'♣',r:'5',k:'def',i:'i-armor'}];
const h=location.hash;
let front=['E101','E101'],back=['E102'],hero={hp:7,mx:9};
if(h=='#hp10'){hero={hp:10,mx:10};document.getElementById('stamp').textContent='#hp10 · 吕布 9+血诏 1 = 10，>6 走紧凑式';}
else if(h=='#enemy18'){front=['B1'];back=[];stage.textContent='第1章首领 · 张角·墨魇';document.getElementById('stamp').textContent='#enemy18 · 敌人一律数字，Boss 血条 18/18';}
else if(h=='#longname'){HAND=[{n:'方天戟·横扫千军',c:2,s:'♦',r:'Q',k:'atk',i:'i-spear',mo:1},{n:'无懈可击',c:1,s:'♠',r:'J',k:'skill',i:'i-scroll'},{n:'七星灯·续命',c:1,s:'♥',r:'7',k:'heal',i:'i-peach'},{n:'借东风',c:2,s:'♣',r:'9',k:'skill',i:'i-scroll'},{n:'诸葛连弩·改',c:1,s:'♦',r:'A',k:'atk',i:'i-arrow'},{n:'杀',c:1,s:'♠',r:'7',k:'atk',i:'i-sword'}];document.getElementById('stamp').textContent='#longname · 20→11px 缩字，仍超宽则省略';}
else document.getElementById('stamp').textContent='default · 吕布 7/9（>6 紧凑式）';
if(h=='#hp10')hero.hp=10;
document.getElementById('hp').innerHTML=heroHp(hero.hp,hero.mx,128-12);
const mk=(id,i,row)=>{const e=ENEMIES[id];const sz=e.boss?[108,152]:row=='back'?[68,96]:[88,124];
 return `<div class="pc ${e.boss?'boss':''}"><div class="w"><div class="slot" style="inset:0"><b>enemies_ch1/${id}</b><i>${sz[0]}×${sz[1]}</i><i>@2x ${sz[0]*2}×${sz[1]*2}</i></div><span class="glyph" style="font-size:${e.boss?64:44}px">${e.g}</span><span class="nm">${e.n}</span>${enemyHp(e)}</div><div class="cnt num" style="--r:${[40,160,280][i%3]}deg">${[2,1,3][i%3]}</div><div class="it ${e.t}">${'<svg><use href="#'+e.it+'"/></svg>'}<span class="num">${e.v}</span></div></div>`};
document.getElementById('front').innerHTML=front.map((x,i)=>mk(x,i,'front')).join('');
document.getElementById('back').innerHTML=back.map((x,i)=>mk(x,i+2,'back')).join('');
const red=s=>s=='♥'||s=='♦';
// 手牌：layoutHand —— 6 张 step=min(72+gap,(366-72)/(n-1))
const step=Math.min(72+6,(366-72)/(HAND.length-1));
document.getElementById('hand').innerHTML=HAND.map((c,i)=>`<div class="card ${c.k} ${c.mo?'moc':''}" style="left:${i*step}px"><div class="in"><div class="art"><svg><use href="#${c.i}"/></svg><div class="slot"><b>card</b><i>58×68</i><i>@2x 116×136</i></div></div><div class="nm">${c.n}</div></div><span class="c num">${c.c}</span><span class="su ${red(c.s)?'r':''}">${c.s}<br><span class="num">${c.r}</span></span>${c.mo?'<span class="mo"><span>墨</span></span>':''}</div>`).join('');
document.fonts.ready.then(()=>document.querySelectorAll('.card .nm').forEach(fitName));
onhashchange=()=>location.reload();
</script></body></html>
