# yaml-language-server: $schema=schema/rules.schema.json
# ───────── 全局规则 ─────────
lingPerTurn: 3 # 每回合军令
drawPerTurn: 3 # 每回合摸牌
firstTurnBonus: 2 # 首回合额外摸牌
minHandLimit: 2 # 手牌上限 = max(2, 当前体力)
handHardCap: 10 # 手牌硬上限：任何时刻最多 10 张，超出的新牌直接进弃牌堆（PRD §5.4，reason hand_overflow）
responseSeconds: 8 # 响应窗口秒数
armorKeep: 2 # 玩家回合开始时护甲最多保留 2 点（V0.3）
enemyArmorKeep: 2 # 敌人从第 2 回合起，回合开始（黄天庇佑前）护甲最多保留 2 点（design-v1 8.1）
maxFlashMarks: 2 # 敌人闪标记上限
maxEnemiesAlive: 3 # 场上存活敌人上限：召唤达到上限时落空（PRD 未写，取组包最大人数）
starterDeck: hero # hero = 用主将配置里的 starterDeck；也可写 decks/ 下的 id

# 敌人意图牌：杀 = 1 点；杀+ = 已进化「锋锐」的杀（2 点）
enemyCards:
  杀: { t: 杀, dmg: 1 }
  杀+: { t: 杀, dmg: 2, mod: 锋锐 }
  万箭: { t: 万箭, dmg: 1 }
  闪: { t: 闪 }
  咒: { t: 咒 }

# 灵光一闪（PRD 8.3）
epiphany:
  baseRate: 0.08
  maxPerBattle: 2
  pityPlays: 12

# 词条稀有度权重：先抽稀有度再抽词条
rarityWeight: { N: 50, R: 35, E: 12, L: 3 }

# 尚未实装的护甲牌数值（V0.3 方案 D），实装后移入卡牌文件
pendingValues:
  gushou: 3 # 固守
  jinchuangyao: 4 # 金创药
  qijinqichu: 3 # 七进七出

# 机制开关（V1 数值，design-v1 第 7 节定稿）
mechanics:
  judgeSource: pool # V1 M1：独立「天机签筒」，52 张标准花色，红 50%（deck = 从玩家摸牌堆判定，旧行为）
  passiveQuotaPerEnemyTurn: 2 # V1 M2：每个敌方回合 limit.passiveQuota 能力（护主、八卦阵…）合计最多生效 2 次；null = 不限
  moying: false # 墨影（M3）：用户决定不加（design-v1 第 7 节），保留开关
  zeroCostPerTurn: 1 # V1 M4：0 费非响应牌每回合每种限 1 次（闪与带 response 标签的牌不计）

# 业务校验开关：第①步保持原型数值，第③步套 V1 时开启
checks:
  starterRedRatio: 0.5 # V1：开局名单武将（roster: true）起始牌组红色正好 50%
  zeroCostDrawNeedsLimit: true # V1 M4：0 费且会摸牌的牌必须带 limit
  comboStartArmorMax: 3

# 未指定选将时的默认组合（8 将全部免费，可任选主将 / 副将）
defaultHeroes: { main: H03, sub: H04 }

# 战间回复体力，拆成两项（PRD 0.5.4 §10.4；design-v1 §12.2）
# sim：3 战回归基线口径（自动对局 / bstat），战间各回 1 体力，模拟营地/丹药等回复
sim:
  baselineBetweenBattleHeal: 1
# map：真实游戏与正式地图流程，H5 不加战后回复（回复由营地、丹药、桃提供）→ 见下方 map.betweenBattleHeal

# 商店卡牌基础价（PRD 14.2，浮动前；卡牌 shopPrice 可单独覆盖）
shop:
  cardPrice: { N: 40, R: 60, E: 90, L: 130 }
  # 宝物基础价（PRD §14.2，按稀有度，浮动前；Boss/L 级不进集市）
  relicPrice: { N: 70, R: 100, E: 140 }
  # 删牌价（PRD §14.2）：removeBase + removeStep × 本局已删次数，不浮动
  removeBase: 50
  removeStep: 25
  # 集市槽位（PRD §14.2 / 10.7【占位】暂按设计稿：2 通用卡 + 1 势力/专属卡 + 1 宝物 + 2 丹药，待总策划定）
  shopSlots: { common: 2, heroCard: 1, relic: 1, potion: 2 }

# 复活（PRD §4.4.1；仅天命<5 时可弹出）：每局次数；体力 = max(hpMin, ceil(上限 × hpRatio))；附带护甲
revive: { count: 1, hpRatio: 0.25, hpMin: 2, armor: 3 }

# 回归预设：只用于自动对局对照，不影响正式选将
presets:
  legacy_guanyu_zhaoyun:
    main: H09
    sub: H03
    deck: prototype
    forceCombos: [龙虎会]
    note: design-v1 第 7.1 节复核基线：关羽 + 赵云（V1 护主）+ 原型 19 张牌组 + 龙虎会原值（开场 3 甲、首杀摸 1）

# ───────── 局与地图（PRD 10.1–10.4、10.9；P3 #44） ─────────
run:
  chapters: 1 # H5 首版只开第 1 章（Boss 张角）

map:
  layers: 8 # 不含 Boss；第 layers+1 层为 Boss
  columns: 4
  paths: 4 # 随机游走路线数
  distinctStarts: 2 # 前 N 条路线起点必须不同列（10.3 第 2 条）
  fixedLayers: { 1: BATTLE, 8: REST } # 固定层（Boss 层固定为 BOSS，不在此列）
  # 按层段的类型权重（10.4；数值定稿 design-v1 §13）；未列出的层用 0 权重会导致生成失败
  weights:
    - { layers: [2, 3], BATTLE: 65, ELITE: 0, EVENT: 22, REST: 0, SHOP: 5, CHEST: 8 }
    - { layers: [4, 5], BATTLE: 50, ELITE: 15, EVENT: 12, REST: 8, SHOP: 10, CHEST: 5 }
    - { layers: [6, 7], BATTLE: 40, ELITE: 22, EVENT: 12, REST: 8, SHOP: 13, CHEST: 5 }
  constraints:
    minLayerFor: { ELITE: 4, REST: 4 } # 约束 1：第 4 层之前不出现
    noConsecutive: [ELITE, REST, SHOP] # 约束 2：同一路线上不连续出现同类
    distinctSiblings: true # 约束 3：同一节点的后继尽量不同类（重抽失败时放宽）
    minElite: 1 # 约束 4：每章至少 1 个精英
    shopOnEveryStart: true # 约束 4（V0.5.3）：每个起点至少能到达 1 个集市
    maxRerolls: 50 # 校验失败用同一种子流重抽的次数，仍失败则放宽约束 3
  betweenBattleHeal: 0 # 真实游戏 / 正式地图：H5 不加战后回复（#77；sim.baselineBetweenBattleHeal 只给三战回归）
  rest: { healMin: 2, healRatio: 0.3 } # 营地疗伤 = max(healMin, floor(最大体力 × healRatio))，不超过上限（PRD 10.6）
  boss: { 1: B1 } # 每章 Boss 敌人 id（开局可见名称与头像）
  nodeIcons: { BATTLE: battle, ELITE: elite, EVENT: event, REST: rest, SHOP: shop, CHEST: chest, BOSS: boss }
  # 以下为 UI 表现参数（render-spec §8.2 / acceptance），占位可调
  layerSpacing: 62 # 卷轴每层高度 dp
  moveMs: 500 # 头像沿路径移动
  pulseMs: 1400 # 可走节点脉冲周期

# 奇遇（#174）
event:
  startArmorCap: 4 # 开场护甲总上限：事件收编护甲 + 宝物开场护甲叠加后最多 4（PRD 5.x）

# 结算将魂（PRD 14.5；#174，原 settlement.ts SETTLEMENT_CONFIG）
settlement:
  soul: { perChapter: 30, perElite: 8, perWin: 2, perBoss: 40, defeatMul: 0.5, tianmingStep: 0.1 } # 将魂 = 章×30 + 精英×8 + 胜场×2 + Boss×40；失败 ×0.5 向下取整；×(1 + 0.1×天命)
  maxTianming: 10 # 天命上限，达到后不再解锁下一级

# ───────── 暂停/设置浮层（#108，v3/settings.html）：局外偏好，存本机偏好键 mojuan.prefs.v1，不进 RunState ─────────
# hidden: true = 底层功能未实现，浮层不显示（配置保留）；toggles：开关项默认值；choices：分段选项（options 顺序即显示顺序，default 必须在 options 里）
settings:
  toggles:
    autoDodge: { label: 自动出闪, default: false }
    endTurnConfirm: { label: 结束回合确认, default: false }
    highContrastHand: { label: 高对比手牌, default: false, hidden: true }
    hurtVibrate: { label: 受伤震动, default: true, hidden: true }
    sound: { label: 音乐 / 音效, default: true, hidden: true }
  choices:
    animSpeed: { label: 动画速度, options: ['1x', '1.5x', '2x'], default: '1x' }
    responseSec: { label: 响应时限, options: ['5', '8', '12'], default: '8' }
    quality: { label: 画质, options: ['低', '中', '高'], default: '中', hidden: true }
