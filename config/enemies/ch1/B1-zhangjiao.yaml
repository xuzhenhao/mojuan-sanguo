# yaml-language-server: $schema=../../schema/enemy.schema.json
# ───────── 第一章 Boss：张角·墨魇 ─────────
# PRD 11.2 / design-v1 10.7（O29 定稿）：HP 18 前排；flashMarksPerTurn 0（闪标记只来自意图）；删除「全场连环」（O36）。
# 闪电用统一卡 D003，张角覆盖 amount = 2：放在玩家判定区，张角每回合开始判定 ♠2–9 命中 2 点雷伤，最多 4 次（可被无懈）。
id: B1
name: 张角·墨魇
shortName: 张角 # 竖排名 / 战斗顶条用短名
chapter: 1
tier: Boss
enabled: true
hp: 20
row: front
flashMarksPerTurn: 0
glyph: 角
# 登场演出（#107）：line 首次/再次登场墨带台词；phaseLine 阶段 2（体力 ≤ 10，召唤黄巾弓手）时显示
intro:
  line: 「苍天已死，黄天当立！」
  phaseLine: 「天雷在此——黄巾儿郎，随我死战！」
cardMods:
  杀+: [E_S01]
trickOverrides:
  D003: { amount: 2 }
intents:
  - [杀+, 杀]
  - [锦囊:D003]
  - [闪, 杀+]
  - [杀+, 杀, 杀]
phases:
  - when: hp_below_50% # 体力 ≤ 10；在张角自己的回合开始时检查
    intents:
      - [杀+, 杀, 杀]
      - [锦囊:D003, 杀+]
      - [杀+, 杀+, 杀]
    summon:
      - { enemy: E102, row: back }
desc: 阶段 2（体力 ≤ 10）：意图强化并从头开始，召唤 1 名黄巾弓手（后排）；杀变雷杀（仅表现，伤害不变）。闪电：每回合开始判定 ♠2–9 受 2 点雷伤，最多 4 次
