# yaml-language-server: $schema=../schema/hero.schema.json
# ───────── 武将：貂蝉（群）─────────
# 数值来源：design-v1-content.md 第 2 节 + design-v1.md 第 7 节定稿。改数值只改本文件，然后 npm run config:check。
id: H02
name: 貂蝉
faction: 群
hp: 7
role: 控场延时：用判定封敌人出杀，手牌循环
unlock: 初始（全部免费）
roster: true

mainSkills:
  - id: lijian
    name: 离间
    kind: 主动技
    desc: 出牌阶段限 1 次：选择一名敌人判定，若不为 ♥，该敌人本回合的杀改为打向其友军（每张 1 点伤害）。
    trigger: { when: active }
    limit: { per: turn, times: 1 }
    do:
      - do: judge
        success: { suit: [H], not: true }
        then:
          - { do: redirect_sha, target: chosen }
  - id: yueyin
    name: 月隐
    kind: 锁定技
    desc: 回合结束时，若你的手牌数少于体力，摸 1 张牌。
    trigger: { when: turn_end }
    if:
      - { type: hand_less_than_hp }
    do:
      - { do: draw, target: self, amount: 1 }

subSkill:
  id: qingguo
  name: 倾国
  kind: 被动
  desc: 主将可将黑色牌当【闪】打出（每 2 回合限 1 次）。
  trigger: { when: static, who: main_hero }
  limit: { per: turn, times: 1, everyNTurns: 2 }
  do:
    - { do: convert, from: { color: black }, as: B004 }

starterDeck: # 12 张，红 6 / 黑 6
  - { card: B001, suit: S, rank: 7 }
  - { card: B001, suit: C, rank: 8 }
  - { card: B001, suit: C, rank: 9 }
  - { card: B001, suit: D, rank: 6 }
  - { card: B004, suit: D, rank: 2 }
  - { card: B004, suit: D, rank: 3 }
  - { card: B005, suit: H, rank: 4 }
  - { card: T001, suit: H, rank: 8 }
  - { card: T012, suit: S, rank: 3 }
  - { card: X201, suit: H, rank: 6 }
  - { card: X201, suit: S, rank: 6 }
  - { card: B006, suit: C, rank: 9 }

exclusiveCards: [X201]

combos:
  - partner: H01
    name: 连环计
    value: 2.5
    note: 定稿改写：每 2 回合首张杀命中后，随机敌人受 1 点伤害
    abilities:
      - id: lianhuanji
        name: 连环计
        desc: 你每回合首张杀造成伤害后，对随机一名敌人造成 1 点伤害（每 2 回合 1 次）。
        trigger: { when: deal_damage, filter: { tag: sha } }
        limit: { per: turn, times: 1, everyNTurns: 2 }
        do:
          - { do: damage, target: random_enemy, amount: 1 }
  - partner: H06
    name: 铜雀
    note: 定稿改写：不替换月隐，独立触发：回合结束手牌少于体力时 +1 甲（每场 3 次）
    value: 2.4
    abilities:
      - id: tongque
        name: 铜雀
        desc: 回合结束时若手牌数少于体力，获得 1 点护甲（每场 3 次）。
        trigger: { when: turn_end }
        limit: { per: battle, times: 3 }
        if:
          - { type: hand_less_than_hp }
        do:
          - { do: armor, target: self, amount: 1 }
