# yaml-language-server: $schema=../schema/hero.schema.json
# ───────── 武将：周瑜（吴）─────────
# 数值来源：design-v1-content.md 第 2 节 + design-v1.md 第 7 节定稿。改数值只改本文件，然后 npm run config:check。
id: H07
name: 周瑜
faction: 吴
hp: 8
role: 火烧连环：先连环再火攻，一次清场
unlock: 初始（全部免费）
roster: true

mainSkills:
  - id: yingfa
    name: 英发
    kind: 锁定技
    desc: 每回合多摸 1 张牌。
    trigger: { when: static }
    do:
      - { do: modify, stat: draw_per_turn, amount: 1, scope: battle }
  - id: zonghuo
    name: 纵火
    kind: 锁定技
    desc: 每回合你首次造成的火焰伤害 +1。
    trigger: { when: static }
    limit: { per: turn, times: 1 }
    do:
      - { do: modify, stat: fire_damage, amount: 1, scope: this_turn }

subSkill:
  id: chiyan
  name: 赤焰
  kind: 被动
  desc: 主将每回合首张杀视为火杀。
  trigger: { when: static, who: main_hero }
  limit: { per: turn, times: 1 }
  do:
    - { do: modify, stat: sha_fire, amount: 1, scope: this_turn }

starterDeck: # 12 张，红 6 / 黑 6
  - { card: B001, suit: S, rank: 7 }
  - { card: B002, suit: H, rank: 4 }
  - { card: B002, suit: D, rank: 5 }
  - { card: B004, suit: D, rank: 2 }
  - { card: B004, suit: C, rank: 2 }
  - { card: B004, suit: S, rank: 2 }
  - { card: B005, suit: H, rank: 12 }
  - { card: T001, suit: D, rank: 7 }
  - { card: T012, suit: C, rank: 3 }
  - { card: X701, suit: H, rank: 10 }
  - { card: X702, suit: C, rank: 12 }
  - { card: B006, suit: S, rank: 9 }

exclusiveCards: [X701, X702]

combos:
  - partner: H08
    name: 赤壁双璧
    value: 1.5
    abilities:
      - id: chibi
        name: 赤壁双璧
        desc: 每场你首次造成火焰伤害时，所有敌人进入连环状态。
        trigger: { when: deal_damage, filter: { tag: fire } }
        limit: { per: battle, times: 1 }
        do:
          - { do: chain, target: all_enemies }
