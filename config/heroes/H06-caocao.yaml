# yaml-language-server: $schema=../schema/hero.schema.json
# ───────── 武将：曹操（魏）─────────
# 数值来源：design-v1-content.md 第 2 节 + design-v1.md 第 7 节定稿。改数值只改本文件，然后 npm run config:check。
id: H06
name: 曹操
faction: 魏
hp: 7
role: 护甲反击：厚血厚甲、慢节奏
unlock: 初始（全部免费）
roster: true

mainSkills:
  - id: jianxiong
    name: 奸雄
    kind: 锁定技
    desc: 你受到伤害（失去体力）后摸 1 张牌（每回合限 1 次）。
    trigger: { when: damaged }
    limit: { per: turn, times: 1 }
    do:
      - { do: draw, target: self, amount: 1 }
  - id: xieling
    name: 挟令
    kind: 主动技
    desc: 出牌阶段限 1 次：弃 1 张牌，获得 2 点护甲；若本回合（至你下回合开始）你的护甲被打穿，对来源造成 1 点伤害。
    trigger: { when: active }
    limit: { per: turn, times: 1 }
    do:
      - { do: discard, target: self, amount: 1, choose: chosen }
      - { do: armor, target: self, amount: 2 }
      - { do: apply_status, target: self, status: xieling }

subSkill:
  id: xieshi
  name: 挟势
  kind: 被动
  desc: 主将回合结束时，若剩余军令 ≥1，获得 1 点护甲。
  trigger: { when: turn_end, who: main_hero }
  if:
    - { type: ling_left_at_least, value: 1 }
  do:
    - { do: armor, target: self, amount: 1 }

starterDeck: # 12 张，红 6 / 黑 6
  - { card: B001, suit: S, rank: 10 }
  - { card: B001, suit: C, rank: 11 }
  - { card: B001, suit: D, rank: 8 }
  - { card: B004, suit: D, rank: 6 }
  - { card: B004, suit: H, rank: 13 }
  - { card: B005, suit: H, rank: 8 }
  - { card: B006, suit: S, rank: 9 }
  - { card: T012, suit: C, rank: 3 }
  - { card: T012, suit: S, rank: 3 }
  - { card: X601, suit: C, rank: 1 }
  - { card: T001, suit: H, rank: 7 }
  - { card: T001, suit: D, rank: 11 }

exclusiveCards: [X601]

combos:
  - partner: H05
    name: 奉孝遗策
    value: 2
    note: design-v1 9.5 第 3 条定稿：只保留手牌上限 +1，正式删除「奸雄每回合额外 +1 次」
    abilities:
      - id: fengxiao
        name: 奉孝遗策
        desc: 你的手牌上限 +1。
        trigger: { when: static }
        do:
          - { do: modify, stat: hand_limit, amount: 1, scope: battle }
  - partner: H04
    name: 青梅
    value: 2.4
    abilities:
      - id: qingmei
        name: 青梅
        desc: 第 3 回合开始时获得 3 点护甲。
        trigger: { when: turn_start }
        if:
          - { type: turn_is, value: 3 }
        do:
          - { do: armor, target: self, amount: 3 }
