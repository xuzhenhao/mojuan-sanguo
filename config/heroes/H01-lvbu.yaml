# yaml-language-server: $schema=../schema/hero.schema.json
# ───────── 武将：吕布（群）─────────
# 数值来源：design-v1-content.md 第 2 节 + design-v1.md 第 7 节定稿。改数值只改本文件，然后 npm run config:check。
id: H01
name: 吕布
faction: 群
hp: 9
role: 爆发连斩：一回合打 3 张杀的爽快感，防御薄
unlock: 初始（全部免费）
roster: true

mainSkills:
  - id: wuchou
    name: 无俦
    kind: 锁定技
    desc: 敌人需消耗 2 枚闪标记才能抵消你的杀。
    trigger: { when: static }
    do:
      - { do: modify, stat: flash_marks_to_dodge, amount: 2, scope: battle }
  - id: xiaolie
    name: 虓烈
    kind: 锁定技
    desc: 本回合你使用的第 2 张起的杀伤害 +1。
    trigger: { when: static }
    if:
      - { type: sha_index_in_turn_at_least, value: 2 }
    do:
      - { do: modify, stat: sha_damage, amount: 1, scope: this_turn }
  - id: xiaohan
    name: 骁悍
    kind: 锁定技
    desc: 每回合你的首张杀造成伤害后，获得 1 点护甲。
    trigger: { when: deal_damage, filter: { tag: sha } }
    limit: { per: turn, times: 1 }
    do:
      - { do: armor, target: self, amount: 1 }

subSkill:
  id: jishi
  name: 戟势
  kind: 被动
  desc: 主将击杀敌人后摸 1 张牌（每回合限 1 次）。
  trigger: { when: kill, who: main_hero }
  limit: { per: turn, times: 1 }
  do:
    - { do: draw, target: self, amount: 1 }

starterDeck: # 12 张，红 6 / 黑 6
  - { card: B001, suit: S, rank: 7 }
  - { card: B001, suit: S, rank: 8 }
  - { card: B001, suit: C, rank: 9 }
  - { card: B001, suit: C, rank: 10 }
  - { card: B001, suit: D, rank: 10 }
  - { card: B004, suit: D, rank: 2 }
  - { card: B004, suit: H, rank: 2 }
  - { card: B005, suit: H, rank: 3 }
  - { card: B006, suit: S, rank: 9 }
  - { card: T001, suit: H, rank: 7 }
  - { card: X101, suit: D, rank: 12 }
  - { card: T012, suit: C, rank: 3 }

exclusiveCards: [X101]

combos:
  - partner: H02
    name: 凤仪亭
    enabled: false
    note: 每场首次离间生效后，吕布的下一张杀 +1（每场 1 次）。需要「离间生效」事件，引擎尚未支持，暂停用
    value: 1.5
    abilities:
      - id: fengyiting
        name: 凤仪亭
        desc: 每场首次离间生效后，你的下一张杀伤害 +1。
        trigger: { when: active }
        limit: { per: battle, times: 1 }
        do:
          - { do: apply_status, target: self, status: aogu }
  - partner: H04
    name: 辕门
    value: 2
    abilities:
      - id: yuanmen
        name: 辕门
        desc: 每场首次击杀敌人后摸 2 张牌。
        trigger: { when: kill }
        limit: { per: battle, times: 1 }
        do:
          - { do: draw, target: self, amount: 2 }
