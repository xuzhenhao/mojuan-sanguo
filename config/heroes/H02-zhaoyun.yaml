# yaml-language-server: $schema=../schema/hero.schema.json
# ───────── 武将：赵云（蜀）─────────
# 改数值只需改本文件，改完运行 `npm run config:check` 校验。
id: H02
name: 赵云
faction: 蜀
hp: 8
role: 杀闪灵活 / 生存
unlock: 初始

mainSkills:
  - id: longdan
    name: 龙胆
    kind: 锁定技
    desc: 锁定：杀可当闪打出，闪可当杀使用
    trigger: { when: static }
    do:
      - { do: convert, from: { tag: sha }, as: B004 }
      - { do: convert, from: { tag: shan }, as: B001 }
  - id: yajiao
    name: 涯角
    kind: 锁定技
    desc: 锁定：出牌阶段使用的第一张杀或闪，摸1张牌
    note: 杀或闪共享每回合 1 次；原型未实装（关羽主将）
    trigger: { when: play }
    limit: { per: turn, times: 1 }
    do:
      - { do: draw, target: self, amount: 1 }

subSkill:
  id: huzhu
  name: 护主
  kind: 被动
  desc: 主将成为杀的目标时，可令其判定，♥ 则此杀无效（每回合限1）
  note: V0.3 仅 ♥；V1 改红色并计入被动配额（第③步）
  trigger: { when: targeted_by_sha, who: main_hero }
  limit: { per: turn, times: 1 }
  do:
    - do: judge
      success: { suit: [H] }
      then:
        - { do: negate_sha, target: current_sha }
