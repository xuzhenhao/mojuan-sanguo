# yaml-language-server: $schema=../schema/hero.schema.json
# ───────── 武将：刘备（蜀）─────────
# 数值来源：design-v1-content.md 第 2 节 + design-v1.md 第 7 节定稿。改数值只改本文件，然后 npm run config:check。
id: H04
name: 刘备
faction: 蜀
hp: 7
role: 仁政续航：存牌换甲，回复强，输出慢
unlock: 初始（全部免费）
roster: true
portrait: portraits/heroes/liubei.webp
portraitFocus: { x: 245, y: 208 } # 脸部中心（512×712 像素）

mainSkills:
  - id: renyi
    name: 仁义
    kind: 锁定技
    desc: 回合结束时，若你的手牌超出上限，可赠出 1 张多余的牌（视为弃置）并获得 1 点护甲（每 2 回合 1 次）。
    note: V1 定稿（用户确认）：每回合 1 次 → 每 2 回合 1 次，效果不变
    trigger: { when: turn_end }
    limit: { per: turn, times: 1, everyNTurns: 2 }
    if:
      - { type: hand_over_limit }
    do:
      - { do: discard, target: self, amount: 1, choose: hand_worst }
      - { do: armor, target: self, amount: 1 }
  - id: jieyi
    name: 结义
    kind: 锁定技
    desc: 你使用【桃】回复体力后，摸 1 张牌。
    trigger: { when: heal, filter: { card: B005 } }
    do:
      - { do: draw, target: self, amount: 1 }

subSkill:
  id: zhaoxian
  name: 招贤
  kind: 被动
  desc: 主将每回合首张杀造成伤害后，摸 1 张牌（每 2 回合限 1 次）。
  trigger: { when: deal_damage, who: main_hero, filter: { tag: sha } }
  limit: { per: turn, times: 1, everyNTurns: 2 }
  do:
    - { do: draw, target: self, amount: 1 }

starterDeck: # 12 张，红 6 / 黑 6
  - { card: B001, suit: S, rank: 8 }
  - { card: B001, suit: C, rank: 10 }
  - { card: B001, suit: D, rank: 7 }
  - { card: B004, suit: D, rank: 4 }
  - { card: B004, suit: C, rank: 4 }
  - { card: B005, suit: H, rank: 6 }
  - { card: B005, suit: H, rank: 9 }
  - { card: T001, suit: S, rank: 11 }
  - { card: T012, suit: C, rank: 3 }
  - { card: X401, suit: H, rank: 12 }
  - { card: SH01, suit: S, rank: 4 }
  - { card: B006, suit: D, rank: 9 }

exclusiveCards: [X401]

combos:
  - partner: H03
    name: 长坂护主
    value: 0.8
    note: design-v1 9.5 第 2 条定稿：战斗开始 1 甲；删除「护主额外对杀+生效」半句（护主本就对所有杀生效）
    abilities:
      - id: changban
        name: 长坂护主
        desc: 战斗开始时获得 1 点护甲。
        trigger: { when: battle_start }
        do:
          - { do: armor, target: self, amount: 1 }
  - partner: H06
    name: 煮酒论英雄
    value: 2
    abilities:
      - id: zhujiu
        name: 煮酒论英雄
        desc: 每场首回合额外摸 2 张牌。
        trigger: { when: turn_start }
        if:
          - { type: turn_is, value: 1 }
        do:
          - { do: draw, target: self, amount: 2 }
