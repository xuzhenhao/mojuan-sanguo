# yaml-language-server: $schema=../schema/hero.schema.json
# ───────── 武将：关羽（蜀）· H09 · 原型数值，保留配置 ─────────
# 改数值只需改本文件，改完运行 `npm run config:check` 校验。
# desc 是玩家看到的文字；note 是策划备注，不显示给玩家。
id: H09
name: 关羽
faction: 蜀
hp: 8
role: 红色杀爆发
unlock: 暂不开放
roster: false # V1：关羽留作第 9 将（回归基线），不进开局名单（design-v1 7.2 第 1 条）

mainSkills:
  - id: wuzhi
    name: 武执
    kind: 锁定技
    desc: 锁定：你的红色牌可当「杀」使用（仍支付杀的费用）
    trigger: { when: static }
    do:
      - { do: convert, from: { color: red }, as: B001 }
  - id: aogu
    name: 傲骨
    kind: 主动技
    desc: 主动，出牌阶段限1：弃1张红色牌，本回合下一张杀伤害+1
    trigger: { when: active }
    limit: { per: turn, times: 1 }
    do:
      - { do: discard, target: self, amount: 1, from: { color: red } }
      - { do: apply_status, target: self, status: aogu, duration: 1 }

subSkill:
  id: zhuwei
  name: 助威
  kind: 被动
  desc: 主将每回合第一次用杀造成伤害后，摸1张牌
  trigger: { when: deal_damage, who: main_hero, filter: { tag: sha } }
  limit: { per: turn, times: 1 }
  do:
    - { do: draw, target: self, amount: 1 }

starterDeck: # PRD 7.3 关羽起始牌组 11 张（roster=false，不做红色 50% 校验）
  - { card: B001, suit: S, rank: 7 }
  - { card: B001, suit: C, rank: 8 }
  - { card: B001, suit: H, rank: 10 }
  - { card: B002, suit: D, rank: 4 }
  - { card: B004, suit: H, rank: 2 }
  - { card: B004, suit: D, rank: 2 }
  - { card: B005, suit: H, rank: 3 }
  - { card: T001, suit: H, rank: 7 }
  - { card: SH01, suit: S, rank: 4 }
  - { card: X004, suit: D, rank: 12 }
  - { card: T012, suit: C, rank: 3 }

combos:
  - partner: H03 # 赵云
    name: 龙虎会
    enabled: false # V1 停用；自动对局回归预设 legacy_guanyu_zhaoyun 强制启用（原值 3 甲）
    note: PRD 7.4；开场护甲在 V1 业务校验中要求 ≤3
    abilities:
      - id: longhu_armor
        name: 龙虎会
        desc: 战斗开始时获得 3 护甲。
        trigger: { when: battle_start }
        do:
          - { do: armor, target: self, amount: 3 }
      - id: longhu_draw
        name: 龙虎会
        desc: 每场战斗首次使用杀后摸 1 张牌。
        trigger: { when: play, filter: { tag: sha } }
        limit: { per: battle, times: 1 }
        do:
          - { do: draw, target: self, amount: 1 }
