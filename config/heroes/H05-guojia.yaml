# yaml-language-server: $schema=../schema/hero.schema.json
# ───────── 武将：郭嘉（魏）─────────
# 数值来源：design-v1-content.md 第 2 节 + design-v1.md 第 7 节定稿。改数值只改本文件，然后 npm run config:check。
id: H05
name: 郭嘉
faction: 魏
hp: 7
role: 卖血过牌：越疼越强，手牌巨大
unlock: 初始（全部免费）
roster: true

mainSkills:
  - id: tiance
    name: 天策
    kind: 锁定技
    desc: 你受到伤害（失去体力）后摸 1 张牌（每回合限 2 次）。
    trigger: { when: damaged }
    limit: { per: turn, times: 2 }
    do:
      - { do: draw, target: self, amount: 1 }
  - id: yiji
    name: 遗计
    kind: 锁定技
    desc: 你的手牌上限 +2。
    trigger: { when: static }
    do:
      - { do: modify, stat: hand_limit, amount: 2, scope: battle }

subSkill:
  id: tiandu
  name: 天妒
  kind: 被动
  desc: 主将受到伤害（失去体力）后摸 1 张牌（每回合限 1 次）。
  trigger: { when: damaged, who: main_hero }
  limit: { per: turn, times: 1 }
  do:
    - { do: draw, target: self, amount: 1 }

starterDeck: # 12 张，红 6 / 黑 6
  - { card: B001, suit: S, rank: 9 }
  - { card: B001, suit: C, rank: 7 }
  - { card: B001, suit: H, rank: 11 }
  - { card: B004, suit: D, rank: 5 }
  - { card: B004, suit: D, rank: 8 }
  - { card: B005, suit: H, rank: 7 }
  - { card: T001, suit: S, rank: 12 }
  - { card: T001, suit: H, rank: 9 }
  - { card: T012, suit: C, rank: 3 }
  - { card: X501, suit: S, rank: 1 }
  - { card: B006, suit: C, rank: 9 }
  - { card: SH01, suit: D, rank: 4 }

exclusiveCards: [X501]

combos:
  - partner: H06
    name: 知遇
    value: 1.6
    abilities:
      - id: zhiyu
        name: 知遇
        desc: 战斗开始时获得 1 点护甲。
        trigger: { when: battle_start }
        do:
          - { do: armor, target: self, amount: 1 }
