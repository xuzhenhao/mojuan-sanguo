# yaml-language-server: $schema=../schema/hero.schema.json
# ───────── 武将：陆逊（吴）─────────
# 数值来源：design-v1-content.md 第 2 节 + design-v1.md 第 7 节定稿。改数值只改本文件，然后 npm run config:check。
id: H08
name: 陆逊
faction: 吴
hp: 9
role: 零费连击：手牌打空就补，一回合打很多张
unlock: 初始（全部免费）
roster: true

mainSkills:
  - id: lianying
    name: 连营
    kind: 锁定技
    desc: 你的手牌打空时摸 2 张牌（每回合限 2 次）。
    trigger: { when: hand_empty }
    limit: { per: turn, times: 2 }
    do:
      - { do: draw, target: self, amount: 2 }
  - id: qianxun
    name: 谦逊
    kind: 锁定技
    desc: 你不会被「咒」弃牌，不会成为乐不思蜀/兵粮寸断的目标；每回合 +1 军令。
    trigger: { when: static }
    do:
      - { do: modify, stat: immune_curse, amount: 1, scope: battle }
  - id: qianxun_ling
    name: 谦逊
    kind: 锁定技
    desc: 每回合开始时 +1 军令。
    trigger: { when: turn_start }
    do:
      - { do: gain_ling, target: self, amount: 1 }

subSkill:
  id: lianying_fu
  name: 连营·辅
  kind: 被动
  desc: 主将手牌打空时摸 1 张牌（每回合 1 次）。
  trigger: { when: hand_empty, who: main_hero }
  limit: { per: turn, times: 1 }
  do:
    - { do: draw, target: self, amount: 1 }

starterDeck: # 12 张，红 6 / 黑 6
  - { card: B001, suit: S, rank: 8 }
  - { card: B001, suit: C, rank: 8 }
  - { card: B001, suit: D, rank: 9 }
  - { card: B004, suit: D, rank: 10 }
  - { card: B004, suit: H, rank: 13 }
  - { card: B005, suit: H, rank: 3 }
  - { card: T001, suit: S, rank: 11 }
  - { card: T012, suit: C, rank: 3 }
  - { card: X801, suit: D, rank: 11 }
  - { card: X802, suit: H, rank: 5 }
  - { card: X802, suit: S, rank: 5 }
  - { card: B001, suit: C, rank: 9 } # V1 定稿：原 B006 ♣9 换成杀

exclusiveCards: [X801, X802]

combos:
  - partner: H07
    name: 火烧连营
    note: 定稿改写：手牌打空后本回合杀视为火杀（每回合 1 次）
    value: 2
    abilities:
      - id: huoshao
        name: 火烧连营
        desc: 你的手牌打空后，本回合你的杀视为火杀（每回合 1 次）。
        trigger: { when: hand_empty }
        limit: { per: turn, times: 1 }
        do:
          - { do: modify, stat: sha_fire, amount: 1, scope: this_turn }
  - partner: H04
    name: 夷陵
    note: 定稿改写：与招贤同时机独立触发
    value: 2
    abilities:
      - id: yiling
        name: 夷陵
        desc: 你每回合首张杀造成伤害后获得 1 点护甲（每 2 回合 1 次，与招贤同时机）。
        trigger: { when: deal_damage, filter: { tag: sha } }
        limit: { per: turn, times: 1, everyNTurns: 2 }
        do:
          - { do: armor, target: self, amount: 1 }
