# yaml-language-server: $schema=../../schema/card.schema.json
# ───────── 装备·防具：八卦阵 ─────────
id: A001
name: 八卦阵
type: 装备
slot: armor
tags: [equip, 判定]
cost: 1
rarity: E                 # V1：R → E（实测 PR #7 下每场抵消 5–13 点，严重超模）
faction: 通用
target: self
desc: 当你成为【杀】的目标时，判定：若为红色，视为你打出了【闪】。（计入被动免伤配额：每个敌方回合与其他判定类防御共享 2 次）
note: |
  价值 = 每敌方回合 min(2, 杀数) × P(红)0.5 ≈ 0.85 × 剩余约 4.5 回合 = 3.8；
  净值 3.8 − 2.5 = +1.3（E 档）。配额封顶后，摸到与没摸到的差距从 9–13 点/场降到约 3 点/场。
value: { effect: 3.8, net: 1.3, calc: "0.85/回合 × 4.5 − 2.5" }
abilities:
  - id: bagua_judge
    name: 八卦
    desc: 成为杀的目标时判定，红色视为打出闪。
    trigger: { when: targeted_by_sha }
    limit: { per: enemy_turn, times: 2, passiveQuota: true }
    do:
      - do: judge
        success: { color: red }
        then:
          - { do: negate_sha, target: current_sha }
instances:
  - { suit: S, rank: 2 }
  - { suit: C, rank: 2 }
