<script>const use=(id,cls='')=>`<svg class="${cls}"><use href="#${id}"/></svg>`;
const red=s=>s=='♥'||s=='♦';
const card=(c,cls='')=>`<div class="card ${c.k} ${c.r||'N'} ${c.mo?'moc':''} ${cls}"><div class="in"><div class="art">${use(c.i)}</div><div class="cn">${c.n}</div></div><span class="c num">${c.c}</span><span class="su ${red(c.s)?'r':''}">${c.s}<br><span class="num">${c.p}</span></span><span class="rar"></span>${c.mo?'<span class="mo"><span>墨</span></span>':''}</div>`;
const beads=(h,m)=>`<div class="beads">${Array.from({length:m},(_,k)=>`<i class="bead ${k<h?'':'e'}"></i>`).join('')}</div>`;
const HEROES=[{n:'吕布',f:'qun',fa:'群',hp:9,s:'boss'},{n:'貂蝉',f:'qun',fa:'群',hp:7,s:'lady'},{n:'赵云',f:'shu',fa:'蜀',hp:8,s:'hero'},{n:'刘备',f:'shu',fa:'蜀',hp:8,s:'hero2'},{n:'郭嘉',f:'wei',fa:'魏',hp:8,s:'scholar'},{n:'曹操',f:'wei',fa:'魏',hp:9,s:'hero2'},{n:'周瑜',f:'wu',fa:'吴',hp:8,s:'scholar'},{n:'陆逊',f:'wu',fa:'吴',hp:7,s:'scholar'}];
function longpress(el,fn){let t;el.addEventListener('pointerdown',()=>{t=setTimeout(fn,420)});['pointerup','pointerleave'].forEach(v=>el.addEventListener(v,()=>clearTimeout(t)));}

// layers bottom(1) -> top(8); x in 0..354, y in px
const T={B:'i-swords',E:'i-helm',V:'i-q',R:'i-tent',S:'i-coin',C:'i-chest'},K={B:'BATTLE',E:'ELITE',V:'EVENT',R:'REST',S:'SHOP',C:'CHEST'};
const L=[[[120,'B'],[240,'V']],[[70,'B'],[180,'C'],[290,'B']],[[60,'V'],[160,'B'],[270,'S']],[[90,'E'],[200,'B'],[300,'R']],[[50,'B'],[150,'S'],[250,'V'],[320,'B']],[[100,'E'],[210,'R'],[300,'B']],[[70,'B'],[180,'E'],[280,'V']],[[120,'S'],[240,'E']]];
const Y=i=>610-i*62; const E=[[[0,0],[0,1],[1,1],[1,2]],[[0,0],[1,1],[2,1],[2,2]],[[0,0],[1,1],[2,2],[1,0]],[[0,0],[0,1],[1,2],[2,3]],[[0,0],[1,0],[2,1],[3,2]],[[0,0],[1,1],[2,2],[1,0]],[[0,0],[1,0],[1,1],[2,1]]];
// E[i] = edges from layer i to i+1 as [from,to]
const path=[[0,0],[1,0],[2,0],[3,0]];// visited: layer idx,node idx ; current = layer3 node1
let g='';E.forEach((es,i)=>{if(i>=7)return;es.forEach(([a,b])=>{const A=L[i][a],B=L[i+1][b];const vis=path.some(([l,n],k)=>l==i&&n==a&&path[k+1]&&path[k+1][1]==b);const nxt=(i==3&&a==0);g+=`<path d="M${A[0]} ${Y(i)} Q${(A[0]+B[0])/2+((i%2)?12:-12)} ${(Y(i)+Y(i+1))/2} ${B[0]} ${Y(i+1)}" stroke="${vis?'#a63d2f':nxt?'#8a6a2a':'#2a2a2a'}" stroke-width="${vis?3.5:nxt?3:1.6}" stroke-dasharray="${vis?'':'4 5'}" opacity="${vis||nxt?.95:.45}"/>`})});
L[7].forEach(([x])=>{g+=`<path d="M${x} ${Y(7)} Q${(x+177)/2} 150 177 140" stroke="#2a2a2a" stroke-width="1.6" stroke-dasharray="4 5" opacity=".45"/>`});
edges.innerHTML=g;
let h='';L.forEach((row,i)=>row.forEach(([x,t],j)=>{const done=path.some(([l,n])=>l==i&&n==j)&&!(i==3&&j==0);const cur=i==3&&j==0;const nxt=i==4&&(j==0||j==1);
 h+=`<div class="node ${K[t]} ${done?'done':''} ${nxt?'next':''} ${cur?'cur':''}" style="left:${x}px;top:${Y(i)}px">${cur?use('hero'):use(T[t])}</div>`}));
nodes.innerHTML=h;
document.body.innerHTML=document.body.innerHTML.replace('%%BEADS%%',beads(6,8));
</script></body></html>
