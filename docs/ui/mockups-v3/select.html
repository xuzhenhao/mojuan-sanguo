<script>const use=(id,cls='')=>`<svg class="${cls}"><use href="#${id}"/></svg>`;
const red=s=>s=='♥'||s=='♦';
const card=(c,cls='')=>`<div class="card ${c.k} ${c.r||'N'} ${c.mo?'moc':''} ${cls}"><div class="in"><div class="art">${use(c.i)}</div><div class="cn">${c.n}</div></div><span class="c num">${c.c}</span><span class="su ${red(c.s)?'r':''}">${c.s}<br><span class="num">${c.p}</span></span><span class="rar"></span>${c.mo?'<span class="mo"><span>墨</span></span>':''}</div>`;
const beads=(h,m)=>`<div class="beads">${Array.from({length:m},(_,k)=>`<i class="bead ${k<h?'':'e'}"></i>`).join('')}</div>`;
const HEROES=[{n:'吕布',f:'qun',fa:'群',hp:9,s:'boss'},{n:'貂蝉',f:'qun',fa:'群',hp:7,s:'lady'},{n:'赵云',f:'shu',fa:'蜀',hp:8,s:'hero'},{n:'刘备',f:'shu',fa:'蜀',hp:8,s:'hero2'},{n:'郭嘉',f:'wei',fa:'魏',hp:8,s:'scholar'},{n:'曹操',f:'wei',fa:'魏',hp:9,s:'hero2'},{n:'周瑜',f:'wu',fa:'吴',hp:8,s:'scholar'},{n:'陆逊',f:'wu',fa:'吴',hp:7,s:'scholar'}];
function longpress(el,fn){let t;el.addEventListener('pointerdown',()=>{t=setTimeout(fn,420)});['pointerup','pointerleave'].forEach(v=>el.addEventListener(v,()=>clearTimeout(t)));}

grid.innerHTML=HEROES.map((h,i)=>`<div class="gf g ${i==2||i==3?'on':''} ${i%2?'':''}"><div class="w"><svg class="fig"><use href="#${h.s}"/></svg><span class="nm">${h.n}</span><span class="fac ${h.f}">${h.fa}</span><div class="hp"><i></i><span class="num">${h.hp}</span></div></div>${i==2?'<span class="seal mk">主</span>':''}${i==3?'<span class="seal mk v">副</span>':''}</div>`).join('');
