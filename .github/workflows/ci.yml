name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run config:check
      - name: 书法收字校验（#182：字表同步 / 微信字体缺字 / 文本表 key）
        run: npm run font:check
      - run: npm run lint
      - run: npm test
      - name: 覆盖率报告（只出报告，不设门槛）
        run: |
          npm run test:coverage -- --silent > coverage.txt 2>&1 || true
          echo '### 覆盖率' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -A6 'Coverage summary' coverage.txt >> "$GITHUB_STEP_SUMMARY" || echo '覆盖率生成失败' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: autoplay 冒烟（固定种子小样本）
        run: npm run autoplay:smoke
      - run: npm run build
      - run: npm run size-check
      - run: npm run build:debug
      - run: npm run build:wechat
      - run: npm run size-check:wechat
